<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JCM INDIAN - India's Own Search Engine</title>
<style>
body{font-family:Arial;text-align:center;margin:0;padding:0;background:#fff}
.top{padding:15px;text-align:right}
select{padding:8px;border-radius:20px;border:1px solid #ccc}
.logo{font-size:55px;font-weight:900;margin-top:70px;color:#1a365d}
.logo span{color:#ff6b00}.logo b{color:#0a9e4a}
.tag{color:#555;font-size:18px;margin-bottom:30px}
.search{width:90%;max-width:600px;margin:auto;display:flex;border:1px solid #ccc;border-radius:50px;padding:8px 8px 8px 20px;box-shadow:0 2px 10px #ddd}
.search input{flex:1;border:none;outline:none;font-size:18px}
.search button{background:#1a56db;color:white;border:none;padding:12px 25px;border-radius:50px;font-size:16px;cursor:pointer}
.btns{margin-top:25px}
.btns button{padding:10px 20px;border-radius:20px;border:1px solid #ddd;background:#f8f8f8;margin:5px}
.footer{position:fixed;bottom:0;width:100%;background:#f2f2f2;padding:12px;color:#555}
</style>
</head>
<body>
<div class="top">
<select id="lang" onchange="changeLang()">
<option value="en">English</option>
<option value="hi">Hindi - हिन्दी</option>
<option value="gu">Gujarati - ગુજરાતી</option>
<option value="mr">Marathi - मराठी</option>
<option value="bn">Bengali - বাংলা</option>
<option value="te">Telugu - తెలుగు</option>
<option value="ta">Tamil - தமிழ்</option>
<option value="kn">Kannada - ಕನ್ನಡ</option>
<option value="ml">Malayalam - മലയാളം</option>
<option value="pa">Punjabi - ਪੰਜਾਬੀ</option>
<option value="ur">Urdu - اردو</option>
<option value="or">Odia - ଓଡ଼ିଆ</option>
<option value="as">Assamese - অসমীয়া</option>
<option value="mai">Maithili - मैथिली</option>
<option value="sat">Santali - ᱥᱟᱱᱛᱟᱲᱤ</option>
<option value="ks">Kashmiri - कश्मीरी</option>
<option value="ne">Nepali - नेपाली</option>
<option value="kok">Konkani - कोंकणी</option>
<option value="sd">Sindhi - सिन्धी</option>
<option value="doi">Dogri - डोगरी</option>
<option value="mni">Manipuri - মণিপুরী</option>
<option value="sa">Sanskrit - संस्कृतम्</option>
</select>
</div>
<div class="logo">JCM <span>IN</span><b>D</b><span>I</span><b>A</b>N</div>
<p class="tag" id="tagline">India's Own Search Engine</p>
<form class="search" onsubmit="doSearch(event)">
<input id="q" type="text" placeholder="Search the web in your language...">
<button type="submit">Search</button>
</form>
<div class="btns">
<button onclick="alert('JCM INDIAN - Made in India')">I'm Feeling Lucky</button>
<button onclick="window.open('https://news.google.com','_blank')">News</button>
</div>
<p style="margin-top:40px;color:#888">Made in India 🇮🇳 | JCM INDIAN</p>
<div class="footer">India | About | Privacy | Terms | Help</div>
<script>
function doSearch(e){
e.preventDefault();
let query=document.getElementById('q').value;
if(!query) return;
let lang=document.getElementById('lang').value;
window.open('https://www.google.com/search?q='+encodeURIComponent(query)+'&hl='+lang,'_blank');
}
function changeLang(){
let l=document.getElementById('lang').value;
let t=document.getElementById('tagline');
if(l=='gu') t.innerText='Bharat nu Potanu Search Engine';
else if(l=='hi') t.innerText='Bharat ka Apna Search Engine';
else t.innerText="India's Own Search Engine";
}
</script>
</body>
</html>
