<body>

</form>
<div class="btns">

function doSearch(e){
e.preventDefault();
let query=document.getElementById('q').value;
if(!query) return;
let lang=document.getElementById('lang').value;
window.open('https://www.google.com/search?q='+encodeURIComponent(query)+'&hl='+lang,'_blank');
 
}

function changeLang(){
let l=document.getElementById('lang').value;
let t=document.getElementById('tagline');
if(l=='gu') t.innerText='Bharat nu Potanu Search Engine';
else if(l=='hi') t.innerText='Bharat ka Apna Search Engine';
else t.innerText="India's Own Search Engine";
