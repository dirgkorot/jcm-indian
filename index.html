<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JCM Indian Search</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<style>
body{min-height:100vh;margin:0;padding:20px;font-family:Arial,sans-serif;text-align:center;color:#fff;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 40%,#0f3460 70%,#533483 100%);background-attachment:fixed}
body.incognito{background:linear-gradient(135deg,#000000 0%,#232526 50%,#414345 100%)!important}
.card{background:rgba(255,255,255,0.12);backdrop-filter:blur(10px);border-radius:20px;padding:25px;max-width:520px;margin:30px auto;box-shadow:0 10px 30px rgba(0,0,0,0.4)}
input{width:75%;max-width:350px;padding:13px;font-size:16px;border-radius:25px;border:none;outline:none}
button{padding:11px 18px;margin:8px 4px;font-size:15px;border:none;border-radius:20px;cursor:pointer;background:#fff;color:#111;font-weight:bold}
button.closeBtn{background:#ff3b30;color:white}
button.iconBtn{background:#ffcc00;font-size:18px}
button.histBtn{background:#00c853;color:white}
select{padding:8px;border-radius:10px;background:white}
.top{display:flex;justify-content:space-between;align-items:center}
#preview{max-width:280px;margin-top:12px;border-radius:12px;display:none}
#voiceCam{display:block}
#historyBox{background:rgba(0,0,0,0.4);border-radius:15px;padding:15px;margin-top:15px;text-align:left;display:none}
.histItem{display:flex;justify-content:space-between;background:rgba(255,255,255,0.15);padding:8px 12px;border-radius:10px;margin:5px 0;cursor:pointer}
.histItem span.del{color:#ff5252;font-weight:bold}
</style>
</head>
<body>
<div class="top">
<h2>🔍 JCM Indian</h2>
<select id="lang" onchange="changeLang()">
<option value="en">English</option><option value="as">অসমীয়া</option><option value="bn">বাংলা</option><option value="brx">बोड़ो</option><option value="doi">डोगरी</option><option value="gu">ગુજરાતી</option><option value="hi">हिन्दी</option><option value="kn">ಕನ್ನಡ</option><option value="ks">کٲشُر</option><option value="gom">कोंकणी</option><option value="mai">मैथिली</option><option value="ml">മലയാളം</option><option value="mni">মণিপুরী</option><option value="mr">मराठी</option><option value="ne">नेपाली</option><option value="or">ଓଡ଼ିଆ</option><option value="pa">ਪੰਜਾਬੀ</option><option value="sa">संस्कृतम्</option><option value="sat">ᱥᱟᱱᱛᱟᱲᱤ</option><option value="sd">سنڌي</option><option value="ta">தமிழ்</option><option value="te">తెలుగు</option><option value="ur">اردو</option>
</select>
</div>

<div class="card">
<h1 id="title">Search in Your Language</h1>
<input id="searchBox" placeholder="Search...">
<div id="voiceCam">
<button class="iconBtn" onclick="startVoice()">🎤</button>
<button class="iconBtn" onclick="document.getElementById('cam').click()">📷</button>
<input type="file" id="cam" accept="image/*" capture="environment" style="display:none" onchange="showImage(event)">
<br><img id="preview">
</div>
<br>
<button id="searchBtn" onclick="doSearch()">Search</button>
<button id="historyBtn" class="histBtn" onclick="toggleHistory()">🕒 History</button>
<br>
<button id="openBtn" onclick="openIncognito()">🕶️ New Incognito Tab</button>
<button id="closeBtn" class="closeBtn" onclick="closeIncognito()" style="display:none">❌ Close Incognito</button>
<p id="status"></p>
<p id="incognitoNote" style="display:none;font-size:13px;opacity:0.8">🔒 Incognito Mode ON che</p>

<!-- HISTORY BOX -->
<div id="historyBox">
<h3 id="histTitle" style="margin:0">🕒 Your History</h3>
<div id="histList"></div>
<button onclick="clearHistory()" style="background:#ff3b30;color:white" id="clearBtn">Clear All History</button>
</div>
</div>

<script>
let T = {
'en':{title:"Search in Your Language",ph:"Search...",search:"Search",open:"🕶️ New Incognito Tab",close:"❌ Close Incognito",on:"Incognito Mode ON - Your search history will not be saved",off:"Incognito Mode OFF - Now your search history will be saved",onStatus:"Incognito Mode is ON",listening:"Listening... Speak now",hist:"🕒 History",histTitle:"🕒 Your History",clear:"Clear All History",noHist:"No History Yet",incHist:"Incognito ma History save thati nathi"},
'gu':{title:"તમારી ભાષામાં શોધો",ph:"શોધો...",search:"શોધો",open:"🕶️ નવો ઇન્કોગ્નિટો ટેબ",close:"❌ ઇન્કોગ્નિટો બંધ કરો",on:"ઇન્કોગ્નિટો મોડ ચાલુ છે - હવે તમારી સર્ચ હિસ્ટ્રી સેવ થશે નહીં",off:"ઇન્કોગ્નિટો મોડ બંધ થયો છે - હવે તમારી સર્ચ હિસ્ટ્રી સેવ થશે",onStatus:"ઇન્કોગ્નિટો મોડ ચાલુ છે",listening:"સાંભળું છું... બોલો",hist:"🕒 હિસ્ટ્રી",histTitle:"🕒 તમારી હિસ્ટ્રી",clear:"બધી હિસ્ટ્રી સાફ કરો",noHist:"હજી કોઈ હિસ્ટ્રી નથી",incHist:"ઇન્કોગ્નિટો માં હિસ્ટ્રી સેવ થતી નથી"},
'hi':{title:"अपनी भाषा में खोजें",ph:"खोजें...",search:"खोजें",open:"🕶️ नया इन्कॉग्निटो टैब",close:"❌ इन्कॉग्निटो बंद करें",on:"इन्कॉग्निटो मोड चालू है - अब आपकी सर्च हिस्ट्री सेव नहीं होगी",off:"इन्कॉग्निटो मोड बंद हो गया है - अब आपकी सर्च हिस्ट्री सेव होगी",onStatus:"इन्कॉग्निटो मोड चालू है",listening:"सुन रहा हूँ... बोलिए",hist:"🕒 हिस्ट्री",histTitle:"🕒 आपकी हिस्ट्री",clear:"सारी हिस्ट्री साफ करें",noHist:"अभी कोई हिस्ट्री नहीं है",incHist:"इन्कॉग्निटो में हिस्ट्री सेव नहीं होती"},
'mr':{title:"तुमच्या भाषेत शोधा",ph:"शोधा...",search:"शोधा",open:"🕶️ नवीन इन्कॉग्निटो टॅब",close:"❌ इन्कॉग्निटो बंद करा",on:"इन्कॉग्निटो मोड चालू आहे - आता तुमची सर्च हिस्ट्री सेव होणार नाही",off:"इन्कॉग्निटो मोड बंद झाला आहे - आता तुमची सर्च हिस्ट्री सेव होईल",onStatus:"इन्कॉग्निटो मोड चालू आहे",listening:"ऐकतोय... बोला",hist:"🕒 हिस्ट्री",histTitle:"🕒 तुमची हिस्ट्री",clear:"सगळी हिस्ट्री साफ करा",noHist:"अजून कोणतीही हिस्ट्री नाही",incHist:"इन्कॉग्निटो मध्ये हिस्ट्री सेव होत नाही"}
};
function getLang(){return document.getElementById('lang').value}
function getT(){return T[getLang()]||T['en']}
function changeLang(){
  let t=getT();
  document.getElementById('title').innerText=t.title;
  document.getElementById('searchBox').placeholder=t.ph;
  document.getElementById('searchBtn').innerText=t.search;
  document.getElementById('openBtn').innerText=t.open;
  document.getElementById('closeBtn').innerText=t.close;
  document.getElementById('historyBtn').innerText=t.hist;
  document.getElementById('histTitle').innerText=t.histTitle;
  document.getElementById('clearBtn').innerText=t.clear;
  if(window.location.search.includes('incognito=1')) document.getElementById('status').innerText=t.onStatus;
}
function isIncognito(){return window.location.search.includes('incognito=1')}
function doSearch(){
  let q=document.getElementById('searchBox').value;
  if(!q) return;
  if(!isIncognito()){
    let h=JSON.parse(localStorage.getItem('jcm_history')||'[]');
    h.unshift({text:q,time:new Date().toLocaleString()});
    h=h.slice(0,50);
    localStorage.setItem('jcm_history',JSON.stringify(h));
  }
  window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank');
}
function toggleHistory(){
  let box=document.getElementById('historyBox');
  if(box.style.display=='block'){box.style.display='none';return;}
  box.style.display='block';
  renderHistory();
}
function renderHistory(){
  let t=getT(); let list=document.getElementById('histList');
  if(isIncognito()){list.innerHTML='<p>'+t.incHist+'</p>';return;}
  let h=JSON.parse(localStorage.getItem('jcm_history')||'[]');
  if(h.length==0){list.innerHTML='<p>'+t.noHist+'</p>';return;}
  list.innerHTML=h.map((item,i)=>'<div class="histItem"><span onclick="searchAgain('+i+')">🔍 '+item.text+'</span><span class="del" onclick="deleteOne('+i+')">✖</span></div>').join('');
}
function searchAgain(i){
  let h=JSON.parse(localStorage.getItem('jcm_history')||'[]');
  document.getElementById('searchBox').value=h[i].text;
  doSearch();
}
function deleteOne(i){
  let h=JSON.parse(localStorage.getItem('jcm_history')||'[]');
  h.splice(i,1); localStorage.setItem('jcm_history',JSON.stringify(h)); renderHistory();
}
function clearHistory(){
  localStorage.removeItem('jcm_history'); renderHistory();
}
function openIncognito(){
  let t=getT(); alert(t.on);
  let base=window.location.href.split('?')[0];
  window.open(base+'?incognito=1&lang='+getLang(),'_blank');
}
function closeIncognito(){
  let t=getT(); alert(t.off);
  window.close();
  setTimeout(function(){window.location.href=window.location.href.split('?')[0]},500);
}
function startVoice(){
  let t=getT();
  let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert("Voice not supported"); return; }
  let rec = new SR();
  let langMap = {'gu':'gu-IN','hi':'hi-IN','en':'en-IN','mr':'mr-IN','ta':'ta-IN','te':'te-IN','bn':'bn-IN','pa':'pa-IN','ml':'ml-IN','kn':'kn-IN','or':'or-IN','as':'as-IN','ur':'ur-IN','ne':'ne-NP'};
  rec.lang = langMap[getLang()] || 'en-IN';
  document.getElementById('status').innerText = t.listening;
  rec.start();
  rec.onresult = function(e){
    document.getElementById('searchBox').value = e.results[0][0].transcript;
    doSearch();
  };
}
function showImage(e){
  let file = e.target.files[0]; if(!file) return;
  let img = document.getElementById('preview');
  img.src = URL.createObjectURL(file); img.style.display='block';
  if(confirm("Photo ne Google Lens ma kholvu che?")) window.open('https://lens.google.com/','_blank');
}
window.onload=function(){
  let p=new URLSearchParams(window.location.search);
  document.getElementById('voiceCam').style.display='block';
  if(p.get('incognito')=='1'){
    document.body.classList.add('incognito');
    document.getElementById('openBtn').style.display='none';
    document.getElementById('closeBtn').style.display='inline-block';
    document.getElementById('incognitoNote').style.display='block';
    document.getElementById('historyBtn').style.display='none';
    if(p.get('lang')) document.getElementById('lang').value=p.get('lang');
  } else {
    document.getElementById('closeBtn').style.display='none';
    document.getElementById('openBtn').style.display='inline-block';
    document.getElementById('incognitoNote').style.display='none';
  }
  changeLang();
  // Enter dabavso to pan search thase
  document.getElementById('searchBox').addEventListener('keypress',function(e){if(e.key=='Enter') doSearch();});
};
</script>
</body>
</html>
